<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игровой чат на Firebase</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e2f;
      color: #fff;
    }
    #gameArea {
      flex: 1;
      position: relative;
      background: #2a2a3d;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #chatPanel {
      height: 200px;
      background: #1a1a2e;
      border-top: 2px solid #444;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    #messages div {
      margin-bottom: 5px;
    }
    #chatForm {
      display: flex;
      padding: 10px;
      background: #222;
    }
    #chatInput {
      flex: 1;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #333;
      color: #fff;
      outline: none;
    }
    #chatInput:focus {
      border-color: #7a7aff;
    }
    button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #5a5aff;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #4a4ae0;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="chatPanel">
    <div id="messages"></div>
    <form id="chatForm">
      <input type="text" id="chatInput" placeholder="Введите сообщение..." autocomplete="off">
      <button type="submit">Отправить</button>
    </form>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="client.js"></script>
</body>
</html>
